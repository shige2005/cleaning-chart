name: Daily cleaning chart to LINE

on:
  schedule:
    - cron: "5 23 * * *"   # JST 08:05
  workflow_dispatch: {}     # 手動実行ボタン

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show workspace (debug)
        run: |
          echo "PWD=$(pwd)"
          echo "GITHUB_WORKSPACE=${{ github.workspace }}"
          ls -la
          echo "--- tree ---"
          find . -maxdepth 2 -type f | sort

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas gspread oauth2client matplotlib requests

      - name: Write SA json
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > sa.json

      - name: Run chart script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: sa.json
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID_COMBINED: ${{ secrets.LINE_GROUP_ID_COMBINED }}
          SUNHOUSE_SHEET_ID: ${{ secrets.SUNHOUSE_SHEET_ID }}
          HUB_SHEET_ID: ${{ secrets.HUB_SHEET_ID }}
          DAYS_PAST: ${{ secrets.DAYS_PAST }}
        run: |
          python "${{ github.workspace }}/make_combined_future_v7.py"
